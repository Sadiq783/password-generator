<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="index.css">

    <!-- Google Font  -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200,800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Generate a <span>random password</span></h1>
            <p class="small-text">Never use an insecure password again.</p>
        </header>
        <main>
            <button type="button" id="generate-password-btn" class="btn">Generate passwords</button>

            <section class="control-buttons">
                <div class="toggle-container">
                    <label for="uppercase-letters-toggle" class="toggle-label">
                        <span>Include Uppercase Letters</span>

                        <span class="toggle">
                            <input type="checkbox" id="uppercase-letters-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>

                <div class="toggle-container">
                    <label for="lowercase-letters-toggle" class="toggle-label">
                        <span>Include Lowercase Letters</span>

                        <span class="toggle">
                            <input type="checkbox" id="lowercase-letters-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>

                <div class="toggle-container">
                    <label for="numbers-toggle" class="toggle-label">
                        <span>Include Numbers</span>

                        <span class="toggle">
                            <input type="checkbox" id="numbers-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>

                <div class="toggle-container">
                    <label for="symbols-toggle" class="toggle-label">
                        <span>Include Symbols</span>

                        <span class="toggle">
                            <input type="checkbox" id="symbols-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>
            </section>

            <hr>

            <section class="output-container" id="output-container">
                <h2>Generated passwords</h2>
                <div class="output-controls">
                    <label for="password-output-one" class="sr-only">Generated password 1</label>
                    <output id="password-output-one" class="password-output" aria-live="polite" tabindex="0"></output>
                    <label for="password-output-two" class="sr-only">Generated password 2</label>
                    <output id="password-output-two" class="password-output" aria-live="polite" tabindex="0"></output>
                </div>
            </section>
        </main>
    </div>


    <script src="index.js"></script>
</body>
</html>
