<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="index.css">

    <!-- Google Font  -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200,800&display=swap" rel="stylesheet">

    <!-- Font Awesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="container">
        <header>
            <h1>Generate a <span>random password</span></h1>
            <p class="small-text">Never use an insecure password again.</p>
        </header>
        <main>
            <button type="button" id="generate-password-btn" class="btn">Generate passwords</button>

            <section class="control-buttons">
                <div class="toggle-container">
                    <label for="uppercase-letters-toggle" class="toggle-label">
                        <span>Include Uppercase Letters</span>

                        <span class="toggle">
                            <input type="checkbox" id="uppercase-letters-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>

                <div class="toggle-container">
                    <label for="lowercase-letters-toggle" class="toggle-label">
                        <span>Include Lowercase Letters</span>

                        <span class="toggle">
                            <input type="checkbox" id="lowercase-letters-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>

                <div class="toggle-container">
                    <label for="numbers-toggle" class="toggle-label">
                        <span>Include Numbers</span>

                        <span class="toggle">
                            <input type="checkbox" id="numbers-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>

                <div class="toggle-container">
                    <label for="symbols-toggle" class="toggle-label">
                        <span>Include Symbols</span>

                        <span class="toggle">
                            <input type="checkbox" id="symbols-toggle">
                            <span class="slider"></span>
                        </span>
                    </label>
                </div>

                <div class="password-len-container">
                    <label for="password-len-range">Password length: </label>
                    <output id="password-len-value">8</output>
                    <input type="range" min="8" max="16" step="1" value="8" id="password-len-range">
                </div>
            </section>
            <p id="options-error" class="options-error" role="alert" hidden>Select at least one character type.</p>

            <hr>

            <section class="output-container" id="output-container">
                <h2>Generated passwords</h2>
                <div class="output-controls">
                    <div class="password-output-wrapper">
                        <label for="password-output-one" class="sr-only">Generated password 1</label>
                        <output id="password-output-one" class="password-output" aria-live="polite" tabindex="0"></output>
                        <button type="button" class="copy-button" data-copy-target="password-output-one" aria-label="Copy generated password 1">
                            <i class="fa-regular fa-copy copy-icon" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="password-output-wrapper">
                        <label for="password-output-two" class="sr-only">Generated password 2</label>
                        <output id="password-output-two" class="password-output" aria-live="polite" tabindex="0"></output>
                        <button type="button" class="copy-button" data-copy-target="password-output-two" aria-label="Copy generated password 2">
                        <i class="fa-regular fa-copy copy-icon" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>


    <script src="index.js"></script>
</body>
</html>
